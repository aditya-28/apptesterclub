name: AppTesterClub
options:
  bundleIdPrefix: club.apptester
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  AppTesterClub:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: AppTesterClub
        CFBundleShortVersionString: "1.8"
        CFBundleVersion: "11"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: Scanning the pairing code on your server connects this app to it.
        # Without this the app never receives apptesterclub:// links at all, so
        # scanning a pairing code with the system Camera does nothing and a
        # notification tap cannot route anywhere.
        CFBundleURLTypes:
          - CFBundleURLName: club.apptester.client
            CFBundleURLSchemes: [apptesterclub]
        # canOpenURL answers false for any scheme not listed here, and that is
        # how the app tells whether a build is already installed. Add the URL
        # scheme of every app you distribute. Apple caps this at 50.
        LSApplicationQueriesSchemes: []
        # Set these to skip the pairing step on a build you make for yourself.
        DefaultServerURL: $(ATC_SERVER_URL)
        DefaultServerToken: $(ATC_SERVER_TOKEN)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: club.apptester.client
        MARKETING_VERSION: "1.8"
        CURRENT_PROJECT_VERSION: "11"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Sources/AppTesterClub.entitlements
        SWIFT_STRICT_CONCURRENCY: complete
schemes:
  AppTesterClub:
    build:
      targets:
        AppTesterClub: all
    run:
      config: Debug
